
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maize Mill Procurement Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen p-6">

<div class="max-w-5xl mx-auto">

    <h1 class="text-3xl font-bold text-gray-800 mb-8">
        Maize Mill Procurement Dashboard
    </h1>

    <!-- TWO MAIN BUTTONS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">

        <button onclick=""
            class="bg-green-600 hover:bg-green-700 text-white p-5 rounded-lg shadow font-bold text-lg">
            Home Page
        </button>


        <button onclick="showForm('maizeForm')"
            class="bg-green-600 hover:bg-green-700 text-white p-5 rounded-lg shadow font-bold text-lg">
            + Add Maize
        </button>

        <button onclick="showForm('packagingForm')"
            class="bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-lg shadow font-bold text-lg">
            + Add Packaging Papers & Bags
        </button>

    </div>

    <!-- MAIZE FORM -->
    <div id="maizeForm" class="hidden bg-white p-6 rounded-lg shadow mb-8">

        <h2 class="text-xl font-bold text-green-700 mb-4">
            Add Maize Purchase
        </h2>

        <form id="maizePurchaseForm" class="space-y-4">

            <input type="number" id="maize_bags"
                placeholder="Number of Maize Bags"
                min="1" required
                class="w-full border p-3 rounded">

            <input type="number" id="maize_cost"
                placeholder="Total Cost"
                min="0" step="0.01" required
                class="w-full border p-3 rounded">

            <input type="date" id="maize_date"
                required class="w-full border p-3 rounded">

            <button type="submit"
                class="bg-green-600 text-white px-6 py-3 rounded hover:bg-green-700">
                Save Maize Purchase
            </button>

            <button type="button" onclick="hideForms()"
                class="bg-gray-500 text-white px-6 py-3 rounded">
                Cancel
            </button>

        </form>
    </div>

    <!-- PACKAGING FORM -->
    <div id="packagingForm" class="hidden bg-white p-6 rounded-lg shadow mb-8">

        <h2 class="text-xl font-bold text-blue-700 mb-4">
            Add Packaging Materials Purchase
        </h2>

        <form id="packagingPurchaseForm" class="space-y-4">

            <label class="block font-medium">Number of Papers</label>
            <input type="number" id="pkg_papers"
                min="0" required
                placeholder="Number of Papers"
                class="w-full border p-3 rounded">

            <label class="block font-medium">Cost of Papers</label>
            <input type="number" id="pkg_cost_papers"
                min="0" step="0.01" required
                placeholder="Cost of Papers"
                class="w-full border p-3 rounded">

            <label class="block font-medium">Number of Packaging Bags</label>
            <input type="number" id="pkg_bags"
                min="0" required
                placeholder="Number of Packaging Bags"
                class="w-full border p-3 rounded">

            <label class="block font-medium">Cost of Packaging Bags</label>
            <input type="number" id="pkg_cost_bags"
                min="0" step="0.01" required
                placeholder="Cost of Packaging Bags"
                class="w-full border p-3 rounded">

            <label class="block font-medium">Date Bought</label>
            <input type="date" id="pkg_date"
                required class="w-full border p-3 rounded">

            <button type="submit"
                class="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700">
                Save Packaging Purchase
            </button>

            <button type="button" onclick="hideForms()"
                class="bg-gray-500 text-white px-6 py-3 rounded">
                Cancel
            </button>

        </form>
    </div>

    <!-- INVENTORY TABLE -->
    <div class="bg-white p-6 rounded-lg shadow">

        <h2 class="text-2xl font-bold text-gray-800 mb-5">
            Current Stock in Store
        </h2>

        <div class="overflow-x-auto">

            <table class="w-full border-collapse">

                <thead>
                    <tr class="bg-gray-700 text-white">
                        <th class="p-4 text-left">Item</th>
                        <th class="p-4 text-left">Quantity in Store</th>
                    </tr>
                </thead>

                <tbody>

                    <tr class="border-b">
                        <td class="p-4 font-medium">Maize Bags</td>
                        <td class="p-4" id="stockMaize">0</td>
                        <td class="p-4 text-right">
                            <button onclick="editStock('maize')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium shadow">
                                Edit
                            </button>
                        </td>
                    </tr>

                    <tr class="border-b">
                        <td class="p-4 font-medium">Packaging Papers</td>
                        <td class="p-4" id="stockPapers">0</td>
                        <td class="p-4 text-right">
                            <button onclick="editStock('papers')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium shadow">
                                Edit
                            </button>
                        </td>
                    </tr>

                    <tr class="border-b">
                        <td class="p-4 font-medium">Packaging Bags</td>
                        <td class="p-4" id="stockBags">0</td>
                        <td class="p-4 text-right">
                            <button onclick="editStock('bags')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm font-medium shadow">
                                Edit
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>
<script>
// Global stock variables
let maizeStock = 0;
let papersStock = 0;
let bagsStock = 0;

// Function to toggle between forms
function showForm(formId) {
    document.getElementById('maizeForm').classList.add('hidden');
    document.getElementById('packagingForm').classList.add('hidden');
    document.getElementById(formId).classList.remove('hidden');
}

// Function to hide all forms
function hideForms() {
    document.getElementById('maizeForm').classList.add('hidden');
    document.getElementById('packagingForm').classList.add('hidden');
}

// Update the inventory table view
function updateStock() {
    document.getElementById('stockMaize').textContent = maizeStock;
    document.getElementById('stockPapers').textContent = papersStock;
    document.getElementById('stockBags').textContent = bagsStock;
}
// Placeholder function for editing stock rows
function editStock(itemType) {
    let currentVal = 0;
    let itemName = "";

    if (itemType === 'maize') {
        currentVal = maizeStock;
        itemName = "Maize Bags";
    } else if (itemType === 'papers') {
        currentVal = papersStock;
        itemName = "Packaging Papers";
    } else if (itemType === 'bags') {
        currentVal = bagsStock;
        itemName = "Packaging Bags";
    }

    const newVal = prompt(`Edit quantity for ${itemName}:`, currentVal);
    if (newVal !== null && newVal.trim() !== "") {
        const parsed = parseInt(newVal, 10);
        if (!isNaN(parsed) && parsed >= 0) {
            if (itemType === 'maize') maizeStock = parsed;
            if (itemType === 'papers') papersStock = parsed;
            if (itemType === 'bags') bagsStock = parsed;
            updateStock();
            // TODO: Add backend API call here if you want to persist the manual correction to your Django database
        } else {
            alert("Please enter a valid positive number.");
        }
    }
}
// Active Edit stock function communicating with Django API
async function editStock(itemType) {
    let itemName = itemType === 'maize' ? "Maize Bags" : (itemType === 'papers' ? "Packaging Papers" : "Packaging Bags");
    let currentQty = itemType === 'maize' ? maizeStock : (itemType === 'papers' ? papersStock : bagsStock);

    const qtyPrompt = prompt(`Enter new total quantity for ${itemName}:`, currentQty);
    if (qtyPrompt === null) return;

    const costPrompt = prompt(`Enter total cost for this update:`, "0.00");
    if (costPrompt === null) return;

    const newQty = parseInt(qtyPrompt, 10);
    const newCost = parseFloat(costPrompt);

    if (isNaN(newQty) || newQty < 0 || isNaN(newCost) || newCost < 0) {
        alert("Please enter valid positive numbers.");
        return;
    }

    try {
        const response = await fetch('/api/update-stock/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                item_type: itemType,
                quantity: newQty,
                cost: newCost
            })
        });

        if (response.ok) {
            alert('Updated successfully in database!');
            loadStock(); // Reload stock from the backend to refresh numbers
        } else {
            const err = await response.json();
            alert('Failed to update: ' + err.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Network error while updating stock.');
    }
}

// CSRF token helper for Django
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// Maize Form Submission
document.getElementById("maizePurchaseForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const bagsVal = document.querySelector("#maize_bags").value;
    const costVal = document.querySelector("#maize_cost").value;
    const dateVal = document.querySelector("#maize_date").value;

    if (!bagsVal || !costVal || !dateVal) {
        alert("Please fill in all fields.");
        return;
    }

    const formData = {
        number_of_bags: parseInt(bagsVal, 10),
        cost: parseFloat(costVal),
        date_bought: dateVal
    };

    try {
        const response = await fetch('/api/maize/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        if (response.ok) {
            maizeStock += parseInt(bagsVal, 10);
            updateStock();
            alert('Maize purchase saved successfully to database!');
            this.reset();
            hideForms();
        } else {
            const errorData = await response.json();
            console.error('Validation errors:', errorData);
            alert('Error saving data: ' + JSON.stringify(errorData));
        }
    } catch (error) {
        console.error('Network error:', error);
        alert('Failed to connect to the server.');
    }
});

// Packaging Form Submission (Added)
document.getElementById("packagingPurchaseForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const papersVal = document.querySelector("#pkg_papers").value;
    const costPapersVal = document.querySelector("#pkg_cost_papers").value;
    const bagsVal = document.querySelector("#pkg_bags").value;
    const costBagsVal = document.querySelector("#pkg_cost_bags").value;
    const dateVal = document.querySelector("#pkg_date").value;

    if (papersVal === "" || costPapersVal === "" || bagsVal === "" || costBagsVal === "" || !dateVal) {
        alert("Please fill in all fields.");
        return;
    }

    const formData = {
        number_of_papers: parseInt(papersVal, 10),
        cost_of_papers: parseFloat(costPapersVal),
        number_of_bags: parseInt(bagsVal, 10),
        cost_of_bags: parseFloat(costBagsVal),
        date_bought: dateVal
    };

    try {
        const response = await fetch('/api/packaging/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        if (response.ok) {
            papersStock += parseInt(papersVal, 10);
            bagsStock += parseInt(bagsVal, 10);
            updateStock();
            alert('Packaging purchase saved successfully to database!');
            this.reset();
            hideForms();
        } else {
            const errorData = await response.json();
            console.error('Validation errors:', errorData);
            alert('Error saving data: ' + JSON.stringify(errorData));
        }
    } catch (error) {
        console.error('Network error:', error);
        alert('Failed to connect to the server.');
    }
});

// Function to fetch current stock from the database on page load
async function loadStock() {
    try {
        const response = await fetch('/api/stock/');
        if (response.ok) {
            const data = await response.json();
            
            // Update global stock variables with database values
            maizeStock = data.maize_stock;
            papersStock = data.papers_stock;
            bagsStock = data.bags_stock;
            
            // Refresh the table view
            updateStock();
        } else {
            console.error('Failed to fetch stock summary');
        }
    } catch (error) {
        console.error('Network error while fetching stock:', error);
    }
}

// Run loadStock automatically as soon as the HTML document is fully loaded
document.addEventListener('DOMContentLoaded', loadStock);
</script>
</body>
</html>
